<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your LoadShift account. Start booking commercial vehicles for your logistics needs in minutes. Free to sign up.">
  <meta name="keywords" content="LoadShift signup, create account, register, commercial vehicle rental, logistics platform">
  <title>Create Account — LoadShift</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="auth-page" id="signup-page">

    <!-- ============================================
         NAVIGATION
         ============================================ -->
    <header class="navbar">
      <div class="container navbar-inner">
        <a href="../index.html" class="logo">LOADSHIFT</a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
        <label for="nav-toggle" class="nav-toggle-label" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <nav class="nav-menu" aria-label="Main navigation">
          <div class="nav-links">
            <a href="../index.html" class="nav-link">Home</a>
            <a href="vehicles.html" class="nav-link">Vehicles</a>
            <a href="../index.html#services" class="nav-link">Services</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link">Contact</a>
          </div>
          <div class="nav-auth">
            <a href="login.html" class="nav-link">Login</a>
            <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
          </div>
        </nav>
      </div>
    </header>


    <!-- ============================================
         SIGNUP FORM
         ============================================ -->
    <main class="auth-wrapper">
      <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
          <a href="../index.html" class="logo">LOADSHIFT</a>
          <h1>Create your account</h1>
          <p>Start booking vehicles in minutes</p>
        </div>

        <!-- Signup Form -->
        <form action="#" method="post" aria-label="Create account form">

          <div class="form-group">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" id="fullname" name="fullname" class="form-input" placeholder="Arjun Mehta" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@company.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="+91 98765 43210" required autocomplete="tel">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" name="terms" value="1" required>
              <span class="form-check-label">I agree to the <a href="#" style="font-weight: 600; text-decoration: underline;">Terms of Service</a> and <a href="#" style="font-weight: 600; text-decoration: underline;">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>

        </form>

        <!-- Divider -->
        <div class="auth-divider">or</div>

        <!-- Google Sign Up -->
        <button type="button" class="btn btn-secondary btn-block">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <!-- Footer -->
        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>

      </div>
    </main>

  </div>

</body>
</html>
